<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>STEP Viewer Demo</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: #0e1116; color: #e6edf3;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
    #app { position: fixed; inset: 0; }
    header { position: fixed; top: 0; left: 0; right: 0; z-index: 10;
      display: flex; align-items: center; flex-wrap: wrap; gap: .75rem; padding: .6rem 1rem;
      background: linear-gradient(#0e1116cc, #0e111600); pointer-events: none; }
    /* Let flex children shrink instead of forcing the bar wider than a phone. */
    header > * { min-width: 0; }
    header h1 { font-size: 1rem; font-weight: 600; margin: 0; letter-spacing: .2px; }
    header .tag { font-size: .72rem; opacity: .6; }
    header .spacer { flex: 1; }
    /* Re-enable pointer events on the button (header itself is click-through). */
    #open-btn { pointer-events: auto; cursor: pointer; font: inherit; font-size: .8rem;
      color: #e6edf3; background: #1b2029; border: 1px solid #2a2f3a; border-radius: 6px;
      padding: .35rem .7rem; }
    #open-btn:hover { background: #232a35; border-color: #3a4150; }
    /* Clear keyboard-focus ring on the interactive controls. Mouse clicks stay
       ring-free via :focus-visible (only keyboard/programmatic focus shows it). */
    #open-btn:focus-visible, #fit-btn:focus-visible, #wire-toggle:focus-visible,
    #gallery .sample:focus-visible {
      outline: 2px solid #4f9dff; outline-offset: 2px; border-color: #4f9dff; }
    /* Wireframe toggle lives in the header; re-enable clicks over the click-through bar. */
    #wire-toggle { pointer-events: auto; cursor: pointer; user-select: none;
      display: inline-flex; align-items: center; gap: .35rem; font-size: .8rem;
      color: #cfe0ff; background: #1b2029; border: 1px solid #2a2f3a; border-radius: 6px;
      padding: .3rem .6rem; }
    #wire-toggle:hover { background: #232a35; border-color: #3a4150; }
    #wire-toggle input { accent-color: #4f9dff; margin: 0; cursor: pointer; }
    /* Reset/Fit-view button — re-frames the model; header is click-through so
       re-enable pointer events here too. */
    #fit-btn { pointer-events: auto; cursor: pointer; font: inherit; font-size: .8rem;
      color: #cfe0ff; background: #1b2029; border: 1px solid #2a2f3a; border-radius: 6px;
      padding: .35rem .7rem; }
    #fit-btn:hover { background: #232a35; border-color: #3a4150; }
    canvas { display: block; }
    #hint { position: fixed; bottom: 1rem; left: 50%; transform: translateX(-50%);
      z-index: 10; font-size: .8rem; opacity: .55; }
    /* Loading spinner — centered, shown while a STEP file parses. */
    #spinner { position: fixed; top: 50%; left: 50%; z-index: 15;
      width: 42px; height: 42px; margin: -21px 0 0 -21px; display: none;
      border: 3px solid #2a2f3a; border-top-color: #4f9dff; border-radius: 50%;
      animation: spin 0.8s linear infinite; pointer-events: none; }
    #spinner.active { display: block; }
    @keyframes spin { to { transform: rotate(360deg); } }
    /* Reduced-motion: stop the perpetual spinner rotation and show a static
       loading indicator instead (the JS render loop also halts the placeholder
       spin under the same query). */
    @media (prefers-reduced-motion: reduce) {
      #spinner { animation: none; border-top-color: #4f9dff; }
    }
    /* Non-blocking error toast. */
    #toast { position: fixed; top: 3.4rem; left: 50%; transform: translateX(-50%);
      z-index: 30; max-width: min(90vw, 420px); font-size: .82rem; line-height: 1.35;
      color: #ffddd8; background: #3a1f1fee; border: 1px solid #7a3b3b; border-radius: 8px;
      padding: .6rem .9rem; box-shadow: 0 6px 20px #0008; pointer-events: none;
      opacity: 0; transition: opacity .2s ease; }
    #toast.active { opacity: 1; pointer-events: auto; }
    /* Sample gallery strip — one button per bundled model. */
    #gallery { position: fixed; left: 0; right: 0; bottom: 2.4rem; z-index: 10;
      display: flex; justify-content: center; flex-wrap: wrap; gap: .5rem;
      padding: 0 1rem; pointer-events: none; }
    #gallery .sample { pointer-events: auto; cursor: pointer; font: inherit;
      font-size: .78rem; color: #cfe0ff; background: #1b2029cc; border: 1px solid #2a2f3a;
      border-radius: 999px; padding: .3rem .8rem; backdrop-filter: blur(4px); }
    #gallery .sample:hover { background: #232a35; border-color: #3a4150; }
    #gallery .sample.is-active { color: #eaf2ff; background: #1f3350cc;
      border-color: #4f9dff; }
    #gallery .sample:disabled { opacity: .5; cursor: progress; }
    /* Full-window drag-over affordance. */
    #drop-overlay { position: fixed; inset: 0; z-index: 20; display: none;
      align-items: center; justify-content: center; pointer-events: none;
      background: #0e1116cc; border: 3px dashed #4f9dff; }
    #drop-overlay.active { display: flex; }
    #drop-overlay span { font-size: 1.1rem; font-weight: 600; color: #cfe0ff;
      padding: 1rem 1.5rem; border-radius: 10px; background: #1b2029cc; }
    /* Narrow phones (~360px): drop the decorative subtitle so the header controls
       fit on one wrapped bar instead of overflowing. */
    @media (max-width: 640px) {
      header .tag { display: none; }
    }
    /* Touch devices: enlarge the interactive targets to a 44px minimum and give a
       bit more breathing room so they're comfortable to tap. */
    @media (pointer: coarse) {
      header { gap: 1rem; }
      #open-btn, #fit-btn { min-height: 44px; padding: .5rem 1rem; }
      #wire-toggle { min-height: 44px; padding: .4rem .8rem; }
      #wire-toggle input { width: 20px; height: 20px; }
      #gallery { gap: .75rem; }
      #gallery .sample { min-height: 44px; padding: .5rem 1.1rem;
        display: inline-flex; align-items: center; }
    }
  </style>
</head>
<body>
  <div id="app" role="img"
       aria-label="Interactive 3D view of the loaded STEP model. Drag to orbit, scroll or pinch to zoom."></div>
  <header>
    <h1>STEP Viewer</h1>
    <span class="tag">three.js · occt-import-js · demo</span>
    <span class="spacer"></span>
    <label id="wire-toggle" title="Toggle wireframe (W)">
      <input id="wire-check" type="checkbox" /> Wireframe
    </label>
    <button id="fit-btn" type="button" title="Reset / fit view (F, or double-click canvas)">Fit view</button>
    <button id="open-btn" type="button">Open STEP file…</button>
    <input id="file-input" type="file" accept=".step,.stp" hidden />
  </header>
  <!-- Doubles as the screen-reader announcement channel: aria-live=polite means
       load start / success / error text set here is read out to AT users. -->
  <div id="hint" aria-live="polite">Loading 3D engine &amp; sample STEP model…</div>
  <nav id="gallery" aria-label="Sample models"></nav>
  <!-- Loader is `active` in static markup so it paints immediately on first load,
       before the ES module (and the multi-MB three.js + occt/WASM download) run.
       The module clears it once the first model actually renders. -->
  <div id="spinner" class="active" role="status" aria-label="Loading"></div>
  <div id="toast" role="alert"></div>
  <div id="drop-overlay"><span>Drop a .step / .stp file to load</span></div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { loadStepFromArrayBuffer } from './src/step.js';

    const app = document.getElementById('app');
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    app.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0e1116);
    const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 1000);
    camera.position.set(3, 2.5, 4);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;

    scene.add(new THREE.HemisphereLight(0xbdd7ff, 0x20242c, 1.1));
    const key = new THREE.DirectionalLight(0xffffff, 1.4);
    key.position.set(5, 8, 6); scene.add(key);
    scene.add(new THREE.GridHelper(10, 10, 0x2a2f3a, 0x1b1f27));
    // X/Y/Z orientation reference sitting at the origin next to the grid.
    scene.add(new THREE.AxesHelper(2));

    // Placeholder object — shown while the sample loads and kept as a fallback
    // if STEP parsing fails, so the scene always stays alive.
    const placeholder = new THREE.Mesh(
      new THREE.TorusKnotGeometry(0.7, 0.24, 160, 24),
      new THREE.MeshStandardMaterial({ color: 0x4f9dff, metalness: 0.35, roughness: 0.4 })
    );
    scene.add(placeholder);

    const hint = document.getElementById('hint');
    // Touch devices orbit/zoom with gestures, not a scroll wheel — word the
    // interaction hint to match the pointer modality.
    const coarsePointer = matchMedia('(pointer: coarse)').matches;
    const zoomHint = coarsePointer ? 'drag to orbit · pinch to zoom'
                                   : 'drag to orbit · scroll to zoom';
    const spinner = document.getElementById('spinner');
    const toast = document.getElementById('toast');
    let spin = placeholder; // object the render loop rotates (null once static model loads)
    let currentModel = null; // the loaded STEP Group currently in the scene, if any
    let wireframe = false; // wireframe render state, applied to loaded meshes

    // Show/hide the centered loading spinner while a STEP file parses.
    function setLoading(on) { spinner.classList.toggle('active', on); }

    // Non-blocking error toast; auto-dismisses. A new message resets the timer.
    let toastTimer = null;
    function showToast(msg) {
      toast.textContent = msg;
      toast.classList.add('active');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove('active'), 5000);
    }

    // Word a load failure by its cause so we never blame "parse" for an
    // engine/CDN download failure or an HTTP fetch failure. Errors are tagged
    // with `kind` at their source: 'init' (occt/WASM/CDN), 'http' (fetch/status),
    // or 'parse' (invalid STEP bytes); anything else falls back to generic.
    function describeError(err, label) {
      const kind = err && err.kind;
      if (kind === 'init')
        return `Could not load ${label} — the 3D engine (occt/WASM) failed to download. Check your connection and reload.`;
      if (kind === 'http')
        return `Could not load ${label} — the file could not be fetched (${err.message}).`;
      if (kind === 'parse')
        return `Could not load ${label} — the file could not be parsed; it may be invalid or an unsupported STEP variant.`;
      return `Could not load ${label} — the file may be invalid or unsupported.`;
    }

    // First-paint loader + stall watchdog. The static spinner is cleared once the
    // first model renders (markFirstRender). If the initial engine+model load has
    // not finished after STALL_MS, surface a real message instead of an eternal
    // spinner so a slow/broken CDN download doesn't look like a hang.
    const STALL_MS = 18000;
    let firstRenderDone = false;
    let stallTimer = null;
    function startStallWatch() {
      clearTimeout(stallTimer);
      stallTimer = setTimeout(() => {
        if (firstRenderDone) return;
        hint.textContent = 'Still loading… this is taking longer than usual — check your connection.';
        showToast('Still loading… the 3D engine and model download is slow. Check your connection.');
      }, STALL_MS);
    }
    function markFirstRender() {
      if (firstRenderDone) return;
      firstRenderDone = true;
      clearTimeout(stallTimer);
      setLoading(false); // clear the first-paint loader once real content is on screen
    }

    // Apply the current wireframe state to every mesh material in a group.
    function applyWireframe(group) {
      if (!group) return;
      group.traverse((obj) => {
        if (!obj.material) return;
        const mats = Array.isArray(obj.material) ? obj.material : [obj.material];
        mats.forEach((m) => { m.wireframe = wireframe; });
      });
    }

    // Free the GPU resources held by a THREE.Group of Meshes.
    function disposeGroup(group) {
      group.traverse((obj) => {
        if (obj.geometry) obj.geometry.dispose();
        if (obj.material) {
          const mats = Array.isArray(obj.material) ? obj.material : [obj.material];
          mats.forEach((m) => m.dispose());
        }
      });
    }

    // Center a group on the origin and frame the camera around it.
    function frameObject(obj) {
      const box = new THREE.Box3().setFromObject(obj);
      if (box.isEmpty()) return;
      const size = box.getSize(new THREE.Vector3());
      const center = box.getCenter(new THREE.Vector3());
      obj.position.sub(center); // recenter at origin

      const radius = 0.5 * Math.max(size.x, size.y, size.z) || 1;
      const dist = radius / Math.sin((camera.fov * Math.PI / 180) / 2) * 1.4;
      camera.position.set(dist * 0.6, dist * 0.5, dist * 0.8);
      camera.near = Math.max(dist / 1000, 0.01);
      camera.far = dist * 1000;
      camera.updateProjectionMatrix();
      controls.target.set(0, 0, 0);
      // Constrain zoom relative to the framed model so users can neither clip
      // through the surface nor fly off to nowhere, and keep panning bounded.
      controls.minDistance = radius * 0.4;
      controls.maxDistance = dist * 6;
      controls.screenSpacePanning = false; // pan in the ground plane, keeps it sane
      controls.update();
    }

    // Re-frame whatever object is currently on screen (loaded STEP model, or the
    // placeholder before/if no model loads). Recoverable from any lost/zoom state.
    function fitView() { frameObject(currentModel || placeholder); }

    // Parse an ArrayBuffer and swap it into the scene, disposing whatever model
    // (or placeholder) is currently shown. `label` is used for the hint text.
    async function showStepFromArrayBuffer(buf, label) {
      const model = await loadStepFromArrayBuffer(buf);
      // Only tear down the old scene contents once the new parse succeeds.
      if (placeholder.parent) {
        scene.remove(placeholder);
        placeholder.geometry.dispose();
        placeholder.material.dispose();
      }
      if (currentModel) {
        scene.remove(currentModel);
        disposeGroup(currentModel);
      }
      spin = null;
      currentModel = model;
      scene.add(model);
      applyWireframe(model); // honor the current toggle on the freshly loaded model
      frameObject(model);
      markFirstRender(); // first successful render clears the loader + stall watch
      hint.textContent = `${label} · ${zoomHint}`;
    }

    // Read a user-supplied File and load it, reporting failures via the hint.
    async function loadFile(file) {
      hint.textContent = `Loading ${file.name}…`;
      setLoading(true);
      try {
        const buf = await file.arrayBuffer();
        await showStepFromArrayBuffer(buf, file.name);
      } catch (err) {
        console.error('STEP load failed:', err);
        hint.textContent = `Could not load ${file.name} — see console`;
        showToast(describeError(err, file.name));
      } finally {
        setLoading(false);
      }
    }

    // --- Sample gallery ---
    // Bundled models under ./samples/. Each parses via occt-import-js (verified
    // in CI-style node checks) and loads through the same path as user files.
    const SAMPLES = [
      { file: 'sample.step',  label: 'Gear' },
      { file: 'block.step',   label: 'Block' },
      { file: 'tetra.step',   label: 'Tetrahedron' },
      { file: 'pyramid.step', label: 'Pyramid' },
    ];

    const gallery = document.getElementById('gallery');

    // Fetch + parse + render a bundled sample, reusing the model-swap path so the
    // placeholder / previous model is disposed exactly as with user files.
    async function loadSample(sample) {
      const buttons = gallery.querySelectorAll('.sample');
      buttons.forEach((b) => { b.disabled = true; });
      hint.textContent = `Loading ${sample.label}…`;
      setLoading(true);
      try {
        const res = await fetch(`./samples/${sample.file}`);
        if (!res.ok) {
          // Non-2xx is a fetch/HTTP problem, not a parse failure — tag it so the
          // toast doesn't wrongly blame parsing.
          const e = new Error(`${sample.file} HTTP ${res.status}`);
          e.kind = 'http';
          throw e;
        }
        const buf = await res.arrayBuffer();
        await showStepFromArrayBuffer(buf, sample.label);
        // Highlight the pill for the model now on screen.
        buttons.forEach((b) => {
          const active = b.dataset.file === sample.file;
          b.classList.toggle('is-active', active);
          b.setAttribute('aria-pressed', active ? 'true' : 'false');
        });
      } catch (err) {
        console.error('STEP load failed:', err);
        hint.textContent = `Could not load ${sample.label} — see console`;
        showToast(describeError(err, sample.label));
      } finally {
        buttons.forEach((b) => { b.disabled = false; });
        setLoading(false);
      }
    }

    for (const sample of SAMPLES) {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'sample';
      btn.textContent = sample.label;
      btn.dataset.file = sample.file;
      btn.setAttribute('aria-pressed', 'false');
      btn.addEventListener('click', () => loadSample(sample));
      gallery.appendChild(btn);
    }

    // Show the first bundled sample on page load. Arm the stall watchdog for this
    // initial engine + model download so a slow/broken CDN doesn't hang forever.
    startStallWatch();
    loadSample(SAMPLES[0]);

    // --- Wireframe toggle (checkbox + `W` key) ---
    const wireCheck = document.getElementById('wire-check');
    function setWireframe(on) {
      wireframe = on;
      wireCheck.checked = on;
      applyWireframe(currentModel);
    }
    wireCheck.addEventListener('change', () => setWireframe(wireCheck.checked));
    addEventListener('keydown', (e) => {
      // Ignore when typing in a field or with modifier keys held.
      if (e.metaKey || e.ctrlKey || e.altKey) return;
      const tag = e.target && e.target.tagName;
      if (tag === 'INPUT' || tag === 'TEXTAREA') return;
      if (e.key === 'w' || e.key === 'W') setWireframe(!wireframe);
      if (e.key === 'f' || e.key === 'F') fitView();
    });

    // --- Reset / fit view (button, `F` key, double-click canvas) ---
    document.getElementById('fit-btn').addEventListener('click', fitView);
    renderer.domElement.addEventListener('dblclick', fitView);

    // --- File picker ---
    const fileInput = document.getElementById('file-input');
    document.getElementById('open-btn').addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', () => {
      if (fileInput.files.length) loadFile(fileInput.files[0]);
      fileInput.value = ''; // allow re-selecting the same file
    });

    // --- Full-window drag-and-drop ---
    const overlay = document.getElementById('drop-overlay');
    let dragDepth = 0; // dragenter/dragleave fire per child; count to avoid flicker

    function hasFiles(e) {
      return e.dataTransfer && Array.from(e.dataTransfer.types || []).includes('Files');
    }
    addEventListener('dragenter', (e) => {
      if (!hasFiles(e)) return;
      e.preventDefault();
      dragDepth++;
      overlay.classList.add('active');
    });
    addEventListener('dragover', (e) => {
      if (!hasFiles(e)) return;
      e.preventDefault();
      e.dataTransfer.dropEffect = 'copy';
    });
    addEventListener('dragleave', (e) => {
      if (!hasFiles(e)) return;
      if (--dragDepth <= 0) { dragDepth = 0; overlay.classList.remove('active'); }
    });
    addEventListener('drop', (e) => {
      e.preventDefault();
      dragDepth = 0;
      overlay.classList.remove('active');
      const file = e.dataTransfer && e.dataTransfer.files[0];
      if (!file) return;
      if (!/\.(step|stp)$/i.test(file.name)) {
        hint.textContent = `${file.name} is not a .step/.stp file`;
        return;
      }
      loadFile(file);
    });

    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });

    // Respect prefers-reduced-motion: skip the perpetual placeholder rotation so
    // the loading state stays static for users who opt out of motion. Live so a
    // mid-session OS setting change is honored.
    const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)');
    renderer.setAnimationLoop(() => {
      if (spin && !reduceMotion.matches) spin.rotation.y += 0.005;
      controls.update();
      renderer.render(scene, camera);
    });
  </script>
</body>
</html>
